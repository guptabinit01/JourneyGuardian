<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JourneyGuardian — Worldwide Journey Planner</title>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.status{
    font-size:13px;
    color:#34d399;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.search-panel{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.inputs{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
}

.input-box{
    position:relative;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d6dce5;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    border:0;
    border-radius:12px;
    padding:0 20px;
    font-weight:700;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:white;
}

.location{
    margin-top:12px;
    background:#eef4ff;
    color:#1d4ed8;
    padding:10px 15px;
}

.suggestions{
    position:absolute;
    top:55px;
    left:0;
    right:0;
    background:white;
    z-index:2000;
    border-radius:10px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    overflow:hidden;
}

.suggestion{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.suggestion:hover{
    background:#f1f5f9;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.mode{
    padding:10px 14px;
    background:#f1f5f9;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
}

.mode.active{
    background:#2563eb;
    color:white;
}

.map-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

#map{
    width:100%;
    height:620px;
}

.info{
    padding:18px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.info-card{
    background:#f8fafc;
    border-radius:12px;
    padding:15px;
}

.info-title{
    font-size:12px;
    color:#64748b;
    margin-bottom:5px;
}

.info-value{
    font-size:20px;
    font-weight:800;
}

.message{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#f8fafc;
    color:#475569;
}

@media(max-width:800px){

    .inputs{
        grid-template-columns:1fr;
    }

    .inputs button{
        height:48px;
    }

    .info{
        grid-template-columns:1fr 1fr;
    }

    #map{
        height:500px;
    }

}

@media(max-width:500px){

    header{
        padding:15px;
    }

    .container{
        padding:10px;
    }

    .info{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
🌍 JourneyGuardian
</div>

<div class="status">
● Worldwide Journey Planner
</div>

</header>

<div class="container">

<div class="search-panel">

<div class="inputs">

<div class="input-box">

<input
id="fromInput"
placeholder="From — city, station, airport..."
autocomplete="off"
/>

<div id="fromSuggestions" class="suggestions"></div>

</div>

<div class="input-box">

<input
id="toInput"
placeholder="To — city, station, airport..."
autocomplete="off"
/>

<div id="toSuggestions" class="suggestions"></div>

</div>

<button class="primary" onclick="findRoute()">
Find Route
</button>

</div>

<button class="location" onclick="useCurrentLocation()">
📍 Use my current location
</button>

<div class="controls">

<div class="mode active" data-mode="DRIVE">
🚗 Road
</div>

<div class="mode" data-mode="WALK">
🚶 Walking
</div>

<div class="mode" data-mode="TRAIN">
🚆 Train
</div>

<div class="mode" data-mode="METRO">
🚇 Metro
</div>

<div class="mode" data-mode="BUS">
🚌 Bus
</div>

<div class="mode" data-mode="FERRY">
⛴️ Ferry
</div>

</div>

<div id="message" class="message">
Enter your starting point and destination.
</div>

</div>

<div class="map-card">

<div id="map"></div>

<div class="info">

<div class="info-card">
<div class="info-title">DISTANCE</div>
<div id="distance" class="info-value">—</div>
</div>

<div class="info-card">
<div class="info-title">ESTIMATED TIME</div>
<div id="duration" class="info-value">—</div>
</div>

<div class="info-card">
<div class="info-title">MODE</div>
<div id="modeInfo" class="info-value">ROAD</div>
</div>

<div class="info-card">
<div class="info-title">STATUS</div>
<div id="routeStatus" class="info-value">READY</div>
</div>

</div>

</div>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;

let fromLocation = null;
let toLocation = null;

let routeLayer = null;

let selectedMode = "DRIVE";


/* ==========================================================
   MAP
========================================================== */

map = L.map("map").setView(
    [20.5937,78.9629],
    5
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:
        '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* ==========================================================
   SEARCH
========================================================== */

let searchTimer = null;


function setupSearch(inputId, suggestionsId, type){

    const input =
        document.getElementById(inputId);

    const suggestions =
        document.getElementById(suggestionsId);


    input.addEventListener(
        "input",
        function(){

            clearTimeout(searchTimer);

            const query =
                input.value.trim();

            if(query.length < 2){

                suggestions.innerHTML = "";

                return;
            }


            searchTimer = setTimeout(
                async function(){

                    try{

                        const response =
                            await fetch(
                                "/search?q=" +
                                encodeURIComponent(query)
                            );

                        const data =
                            await response.json();


                        suggestions.innerHTML = "";


                        if(!Array.isArray(data)){

                            return;
                        }


                        data.forEach(
                            function(place){

                                const div =
                                    document.createElement("div");

                                div.className =
                                    "suggestion";

                                div.textContent =
                                    place.name;


                                div.onclick =
                                    function(){

                                        input.value =
                                            place.name;

                                        suggestions.innerHTML =
                                            "";


                                        const location = {

                                            lat:
                                                Number(place.lat),

                                            lon:
                                                Number(place.lon),

                                            name:
                                                place.name

                                        };


                                        if(type === "from"){

                                            fromLocation =
                                                location;

                                        }else{

                                            toLocation =
                                                location;

                                        }


                                        map.setView(
                                            [
                                                location.lat,
                                                location.lon
                                            ],
                                            13
                                        );

                                    };


                                suggestions.appendChild(div);

                            }
                        );

                    }catch(error){

                        console.error(
                            "Search error:",
                            error
                        );

                    }

                },
                500
            );

        }
    );

}


setupSearch(
    "fromInput",
    "fromSuggestions",
    "from"
);


setupSearch(
    "toInput",
    "toSuggestions",
    "to"
);


/* ==========================================================
   CURRENT LOCATION
========================================================== */

function useCurrentLocation(){

    if(!navigator.geolocation){

        alert(
            "Location is not supported by this browser."
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            fromLocation = {

                lat:
                    position.coords.latitude,

                lon:
                    position.coords.longitude,

                name:
                    "My current location"

            };


            document.getElementById(
                "fromInput"
            ).value =
                "My current location";


            map.setView(
                [
                    fromLocation.lat,
                    fromLocation.lon
                ],
                15
            );


            L.marker(
                [
                    fromLocation.lat,
                    fromLocation.lon
                ]
            )
            .addTo(map)
            .bindPopup(
                "📍 Your current location"
            )
            .openPopup();

        },

        function(){

            alert(
                "Unable to get your current location."
            );

        }

    );

}


/* ==========================================================
   MODE SELECT
========================================================== */

document
.querySelectorAll(".mode")
.forEach(

    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(".mode")
                .forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );


                button.classList.add(
                    "active"
                );


                selectedMode =
                    button.dataset.mode;


                document.getElementById(
                    "modeInfo"
                ).textContent =
                    button.textContent
                    .replace(/[^\w\s]/gi,"")
                    .trim()
                    .toUpperCase();

            }
        );

    }

);


/* ==========================================================
   ROUTE
========================================================== */

async function findRoute(){

    const message =
        document.getElementById(
            "message"
        );


    if(!fromLocation){

        message.textContent =
            "Please select a starting location.";

        return;
    }


    if(!toLocation){

        message.textContent =
            "Please select a destination.";

        return;
    }


    message.textContent =
        "Finding the best route...";


    document.getElementById(
        "routeStatus"
    ).textContent =
        "LOADING";


    if(routeLayer){

        map.removeLayer(
            routeLayer
        );

        routeLayer = null;

    }


    try{

        let endpoint;


        if(selectedMode === "WALK"){

            endpoint =
                "/walking-route";

        }

        else if(selectedMode === "DRIVE"){

            endpoint =
                "/driving-route";

        }

        else{

            message.textContent =
                selectedMode +
                " route mapping will be added using transit data.";

            document.getElementById(
                "routeStatus"
            ).textContent =
                "TRANSIT";

            return;

        }


        const response =
            await fetch(
                endpoint,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        from_lat:
                            fromLocation.lat,

                        from_lon:
                            fromLocation.lon,

                        to_lat:
                            toLocation.lat,

                        to_lon:
                            toLocation.lon

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Route unavailable"
            );

        }


        /* --------------------------------------------------
           DRAW REAL ROUTE
        -------------------------------------------------- */

        const coordinates =
            data.geometry.coordinates.map(
                point =>
                [
                    point[1],
                    point[0]
                ]
            );


        routeLayer =
            L.polyline(
                coordinates,
                {

                    weight:7,

                    opacity:.9,

                    color:
                        selectedMode === "WALK"
                        ? "#2563eb"
                        : "#ef4444"

                }
            ).addTo(map);


        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding:[40,40]
            }
        );


        /* --------------------------------------------------
           MARKERS
        -------------------------------------------------- */

        L.marker(
            [
                fromLocation.lat,
                fromLocation.lon
            ]
        )
        .addTo(map)
        .bindPopup(
            "START<br>" +
            fromLocation.name
        );


        L.marker(
            [
                toLocation.lat,
                toLocation.lon
            ]
        )
        .addTo(map)
        .bindPopup(
            "DESTINATION<br>" +
            toLocation.name
        );


        /* --------------------------------------------------
           INFORMATION
        -------------------------------------------------- */

        document.getElementById(
            "distance"
        ).textContent =
            data.distance_km +
            " km";


        document.getElementById(
            "duration"
        ).textContent =
            formatDuration(
                data.duration_min
            );


        document.getElementById(
            "routeStatus"
        ).textContent =
            "FOUND";


        message.textContent =
            "Route successfully calculated.";

    }

    catch(error){

        console.error(
            error
        );


        document.getElementById(
            "routeStatus"
        ).textContent =
            "ERROR";


        message.textContent =
            "Unable to calculate route: " +
            error.message;

    }

}


/* ==========================================================
   TIME
========================================================== */

function formatDuration(minutes){

    minutes =
        Number(minutes);


    if(minutes < 60){

        return minutes +
            " min";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    if(mins === 0){

        return hours +
            " hr";

    }


    return hours +
        " hr " +
        mins +
        " min";

}

</script>

</body>
</html>
